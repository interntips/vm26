<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Webbvy</title>
    <style>
        /* Tillåt naturlig scroll på hela sidan */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Behållaren är precis så hög som iFramen */
        .container {
            width: 100%;
            height: 2500px;
            position: relative;
        }

        /* iFramen tar upp hela behållarens höjd */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Om du behöver klicka i arket, ta bort eller kommentera ut denna overlay */
        .click-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 5;
            pointer-events: none; /* Ändra till 'all' om du vill prioritera scroll framför klick */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="click-shield"></div>
        <iframe 
            src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AAB98&wdHideGridlines=True&nav=1&action=embedview"
            sandbox="allow-scripts allow-same-origin allow-forms">
        </iframe>
    </div>

</body>
</html>
