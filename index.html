<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excel Webbvy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Förhindrar dubbelscroll */
        }

        /* Denna behållare är nyckeln för Android */
        .outer-container {
            width: 100%;
            height: 100%;
            overflow-y: scroll; /* Tvingar vertikal scroll */
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y; /* Tillåter endast vertikal dragning */
        }

        .inner-content {
            width: 100%;
            height: 2500px; /* Samma höjd som ditt Excel-intervall */
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: auto; /* Tillåter interaktion med celler */
        }
    </style>
</head>
<body>

    <div class="outer-container">
        <div class="inner-content">
            <iframe 
                src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AAB98&wdHideGridlines=True&nav=1&action=embedview"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>
    </div>

</body>
</html>
