<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fotbolls-VM 2026 - Interntips</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f3f2f1;
        }

        #viewport {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Datorn sköter scrollen inuti iFramen nu */
            position: relative;
        }

        /* Behållaren för iFramen */
        #zoom-layer {
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }

        /* Mobilinställningar (Skärmar under 768px) */
        @media (max-width: 768px) {
            #viewport {
                overflow-x: hidden; 
                overflow-y: auto; /* Aktiverar mobilens fasta scroll */
            }
            #zoom-layer {
                width: 535px; 
                height: 1870px; /* Din intrimmade mobilhöjd */
                overflow: hidden;
                transition: transform 0.1s ease-out;
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            iframe { 
                pointer-events: none; /* Blockera Excel-touch på mobil för att tillåta nyp-zoom */
            }
            #touch-handler {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 10;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="zoom-layer">
            <div id="touch-handler"></div>
            <!-- Vi tog bort &wdInScene=1 eftersom den förstorade sönder datorvyn -->
            <iframe 
                src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AJ96&wdHideGridlines=True&nav=0&action=embedview"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>
    </div>

<script>
    const zoomLayer = document.getElementById('zoom-layer');
    const targetWidth = 535; 
    
    let scale = 1;
    let startDist = 0;
    let posX = 0;
    let posY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    function adjustZoom() {
        if (window.innerWidth <= 768) {
            scale = window.innerWidth / targetWidth;
            posX = 0;
            posY = 0;
            updateTransform();
            return scale;
        }
        zoomLayer.style.transform = 'none';
        zoomLayer.style.width = '100%';
        zoomLayer.style.height = '100%';
        return 1;
    }

    function updateTransform() {
        zoomLayer.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
    }

    window.addEventListener('resize', () => { adjustZoom(); });

    document.addEventListener('touchstart', (e) => {
        if (window.innerWidth > 768) return;

        if (e.touches.length === 1) {
            isPanning = true;
            startX = e.touches[0].pageX - posX;
            startY = e.touches[0].pageY - posY;
        } else if (e.touches.length === 2) {
            isPanning = false;
            startDist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );
        }
    });

    document.addEventListener('touchmove', (e) => {
        if (window.innerWidth > 768) return;
        e.preventDefault(); 

        if (isPanning && e.touches.length === 1) {
            posX = e.touches[0].pageX - startX;
            posY = e.touches[0].pageY - startY;
            
            // NYA/LÄTTARE GRÄNSER:
            // Tillåt friare panorering i sidled (X-led) så fort man rör fingret
            const minPanX = window.innerWidth - (targetWidth * scale);
            // Om arket är utzoomat, centrera eller lås till 0. Om inzoomat, tillåt panorering.
            if (minPanX < 0) {
                posX = Math.min(100, Math.max(minPanX - 100, posX)); // Ger 100px extra "elastisk" marginal på sidorna
            } else {
                posX = 0; // Lås till mitten/vänster om allt får plats
            }
            
            // Höjdgräns (Y-led) - Behåller spärren så man inte tappar bort botten
            const minPanY = window.innerHeight - (1850 * scale);
            posY = Math.min(0, Math.max(minPanY, posY));

            updateTransform();
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
            );

            if (startDist !== 0) {
                const delta = dist / startDist;
                const oldScale = scale;
                scale = Math.min(Math.max(window.innerWidth / targetWidth, scale * delta), 2.5); // Ökat max-zoom till 2.5
                
                posX = posX * (scale / oldScale);
                posY = posY * (scale / oldScale);
                
                updateTransform();
                startDist = dist;
            }
        }
    }, { passive: false });

    document.addEventListener('touchend', () => {
        startDist = 0;
        isPanning = false;
    });

    adjustZoom();
</script>
</body>
</html>
