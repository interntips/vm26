<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Excel A:J Anpassad</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f3f2f1;
        }

        #viewport {
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        /* Dator: Standardvy */
        #zoom-layer {
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }

        /* Mobil: Anpassa efter kolumn A-J (ca 800px) */
        @media (max-width: 768px) {
            #zoom-layer {
                /* Vi sätter bredden till 850px för att ge lite marginal för kolumn J */
                width: 550px; 
                height: 2500px;
                /* Dynamisk skalning: (Skärmbredd / 850) beräknas av JS för exakt passform */
                transform: scale(0.45); 
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            iframe { pointer-events: none; }
            #touch-handler {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 10;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="zoom-layer">
            <div id="touch-handler"></div>
            <iframe 
                src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AAB98&wdHideGridlines=True&nav=1&action=embedview"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>
    </div>

    <script>
        const zoomLayer = document.getElementById('zoom-layer');
        const targetWidth = 850; // Bredden på kolumn A till J + marginal
        
        function adjustZoom() {
            if (window.innerWidth <= 768) {
                // Beräknar exakt skala så att A-J fyller skärmen
                const newScale = window.innerWidth / targetWidth;
                zoomLayer.style.transform = `scale(${newScale})`;
                return newScale;
            }
            zoomLayer.style.transform = `scale(1)`;
            return 1;
        }

        let scale = adjustZoom();
        let startDist = 0;

        // Uppdatera zoom om skärmen roteras
        window.addEventListener('resize', () => { scale = adjustZoom(); });

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );

                if (startDist === 0) {
                    startDist = dist;
                } else {
                    const delta = dist / startDist;
                    scale = Math.min(Math.max(0.1, scale * delta), 1.5);
                    zoomLayer.style.transform = `scale(${scale})`;
                    startDist = dist;
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            startDist = 0;
        });
    </script>
</body>
</html>
