<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Excel Webbvy - Bred vy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f3f2f1;
        }

        #viewport {
            width: 100%;
            height: 100%;
            overflow: auto; /* Möjliggör både vertikal och horisontell scroll */
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        #zoom-layer {
            transform-origin: 0 0;
            /* Vi sätter en mycket stor bredd här för att tvinga Excel att visa fler kolumner */
            width: 1600px; 
            height: 2500px; 
            transition: transform 0.1s ease-out;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            pointer-events: none;
        }

        #touch-handler {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="zoom-layer" style="transform: scale(0.4);"> <!-- Startar mer utzoomat -->
            <div id="touch-handler"></div>
            <iframe 
                src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AAB98&wdHideGridlines=True&nav=1&action=embedview"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>
    </div>

    <script>
        const zoomLayer = document.getElementById('zoom-layer');
        let scale = 0.4; // Lägre startvärde = ser fler celler direkt
        let startDist = 0;

        document.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );

                if (startDist === 0) {
                    startDist = dist;
                } else {
                    const delta = dist / startDist;
                    scale = Math.min(Math.max(0.2, scale * delta), 1.5);
                    zoomLayer.style.transform = `scale(${scale})`;
                    startDist = dist;
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            startDist = 0;
        });
    </script>
</body>
</html>
