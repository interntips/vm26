<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fotbolls-VM 2026 - Interntips</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f3f2f1;
        }

        #viewport {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Datorn sköter scrollen inuti iFramen nu */
            position: relative;
        }

        /* Behållaren för iFramen */
        #zoom-layer {
            transform-origin: 0 0;
            width: 100%;
            height: 100%;
        }

        /* Mobilinställningar (Skärmar under 768px) */
        @media (max-width: 768px) {
            #viewport {
                overflow-x: hidden; 
                overflow-y: auto; /* Aktiverar mobilens fasta scroll */
            }
            #zoom-layer {
                width: 535px; 
                height: 1850px; /* Din intrimmade mobilhöjd */
                overflow: hidden;
                transition: transform 0.1s ease-out;
            }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 768px) {
            iframe { 
                pointer-events: none; /* Blockera Excel-touch på mobil för att tillåta nyp-zoom */
            }
            #touch-handler {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 10;
            }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="zoom-layer">
            <div id="touch-handler"></div>
            <!-- Vi tog bort &wdInScene=1 eftersom den förstorade sönder datorvyn -->
            <iframe 
                src="https://1drv.ms/x/c/e8830cf447bdf3d5/IQRCu4LbUSNUT6SOXII_dut2AeY16NyzBwAVM06qUXYjOrc?em=2&wdAllowInteractivity=True&Item='START'!A1%3AJ96&wdHideGridlines=True&nav=0&action=embedview"
                sandbox="allow-scripts allow-same-origin allow-forms">
            </iframe>
        </div>
    </div>

    <script>
        const zoomLayer = document.getElementById('zoom-layer');
        const targetWidth = 535; 
        
        function adjustZoom() {
            if (window.innerWidth <= 768) {
                const newScale = window.innerWidth / targetWidth;
                zoomLayer.style.transform = `scale(${newScale})`;
                return newScale;
            }
            // På dator: Rensa alla omräkningar helt
            zoomLayer.style.transform = 'none';
            zoomLayer.style.width = '100%';
            zoomLayer.style.height = '100%';
            return 1;
        }

        let scale = adjustZoom();
        let startDist = 0;

        window.addEventListener('resize', () => { scale = adjustZoom(); });

        // Touch-logik (Körs bara om det faktiskt är en mobil/touch-skärm)
        document.addEventListener('touchmove', (e) => {
            if (window.innerWidth <= 768 && e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );

                if (startDist === 0) {
                    startDist = dist;
                } else {
                    const delta = dist / startDist;
                    scale = Math.min(Math.max(0.1, scale * delta), 1.5);
                    zoomLayer.style.transform = `scale(${scale})`;
                    startDist = dist;
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            startDist = 0;
        });
    </script>
</body>
</html>
